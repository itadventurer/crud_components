name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One leg, on the Ruby the gemspec floors at: the config pins TargetRubyVersion,
  # so a second Ruby would inspect the same code against the same rules.
  lint:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rubocop --format github

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} · Rails ${{ matrix.rails }}${{ !matrix.libvips && ' · no libvips' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # A representative spread, not the full cartesian: every supported Ruby
        # (3.2–4.0) and every supported Rails (7.1, 7.2, 8.0, 8.1) appears, within
        # each Rails's own Ruby floor (7.2 needs 3.1+, 8.0 needs 3.2+). The last
        # leg leaves the native libvips out, like the demo image.
        include:
          - { ruby: '3.2', rails: '7.1', libvips: true }
          - { ruby: '3.2', rails: '8.0', libvips: true }
          - { ruby: '3.3', rails: '7.2', libvips: true }
          - { ruby: '3.3', rails: '8.0', libvips: true }
          - { ruby: '3.4', rails: '8.0', libvips: true }
          - { ruby: '3.4', rails: '8.1', libvips: true }
          - { ruby: '4.0', rails: '8.0', libvips: true }
          - { ruby: '4.0', rails: '8.1', libvips: true }
          - { ruby: '4.0', rails: '8.1', libvips: false }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      # The dummy app boots Active Storage, whose default :vips processor loads
      # ruby-vips, which needs the native libvips.
      - if: matrix.libvips
        run: sudo apt-get update && sudo apt-get install -y libvips
      # Resolve a fresh lockfile so each Rails minor gets compatible deps.
      - run: rm -f Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
