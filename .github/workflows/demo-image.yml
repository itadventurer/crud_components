name: Demo image

# Builds the live-demo image (the bundled test/dummy playground) and pushes it
# to the GitHub Container Registry. Runs on every push to main so the demo stays
# current, and on demand. No secrets needed — auth is the workflow's GITHUB_TOKEN.
#
# Deploy it with deploy/k8s.yaml (set `image:` to the tag below), or run locally:
#   docker run --rm -p 8080:8080 ghcr.io/itadventurer/crud-components/demo:latest
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/demo:${{ github.sha }}
            ghcr.io/${{ github.repository }}/demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ### Restart deployments
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          # Client within one minor version of the cluster (v1.35.2).
          version: v1.35.4

      - name: Set Kubernetes Context
        run: |
          mkdir -p ${HOME}/.kube
          echo "${{ secrets.REDEPLOYER_KUBECONFIG }}" > ${HOME}/.kube/config
          chmod 600 ${HOME}/.kube/config

      - name: Roll out Deployment
        run: |
          # Not `rollout restart`: Flux strips fields of managers named kubectl* and rolls back.
          kubectl patch deployment/crud-components-zelenin-de -n crud-components-zelenin-de \
            --field-manager=ci-deploy --type=merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"ci-deploy/commit\":\"${{ github.sha }}\",\"ci-deploy/run\":\"${{ github.run_id }}-${{ github.run_attempt }}\"}}}}}"
          # A new run (or attempt) also changes the template when the same commit is deployed again.
          # Wait for the rollout with `get` only, so the step needs no list/watch.
          done_=""
          for i in $(seq 60); do
            if ! s=$(kubectl get deployment/crud-components-zelenin-de -n crud-components-zelenin-de -o jsonpath='{.metadata.generation}/{.status.observedGeneration}/{.spec.replicas}/{.status.updatedReplicas}/{.status.replicas}/{.status.availableReplicas}' 2>/tmp/get.err); then
              cat /tmp/get.err >&2
              # Fail at once on a permission or lookup error, retry only transient ones.
              if grep -qE 'Forbidden|NotFound|Unauthorized' /tmp/get.err; then exit 1; fi
              s=""
            fi
            echo "generation/observed/wanted/updated/current/available: $s"
            IFS=/; set -- $s; unset IFS
            if [ -n "$1" ] && [ "${2:-0}" -ge "$1" ] && [ "${4:-0}" -eq "$3" ] && [ "${5:-0}" -eq "$3" ] && [ "${6:-0}" -eq "$3" ]; then
              done_=1; break
            fi
            sleep 5
          done
          [ -n "$done_" ] || { echo "Rollout of crud-components-zelenin-de not finished after 5 minutes" >&2; exit 1; }
