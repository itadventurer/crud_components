plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake

AllCops:
  # The gemspec's floors. Cops that would suggest newer syntax stay quiet —
  # rubocop-rails would otherwise propose `params.expect` and other Rails 8 API
  # into code that has to keep running on 7.1.
  TargetRubyVersion: 3.2
  TargetRailsVersion: '7.1'
  NewCops: enable
  Exclude:
    - 'gemfiles/**/*'
    - 'test/dummy/bin/**/*'
    - 'test/dummy/db/schema.rb'
    - 'vendor/**/*'

# Deliberate, not debt — these two are style decisions this project has made.
# Everything else that is currently unclean lives in .rubocop_todo.yml, with a
# count, so it can be burnt down cop by cop instead of hidden.

# A test here walks one flow and checks every step of it. Splitting that into
# one assertion per test would hide the flow, which is the thing under test.
Minitest/MultipleAssertions:
  Enabled: false

# The DSL takes keyword arguments by design — `crud_collection` alone has eight,
# all optional and named. A positional-parameter limit does not apply.
Metrics/ParameterLists:
  Enabled: false

# The bookstore playground and the tests are fixtures, not published API. A
# doc comment on `class BooksController` says nothing the name does not.
# In lib/ and app/ the cop stays on — that is the documented surface.
Style/Documentation:
  Exclude:
    - 'test/**/*'


# The gems here are grouped by what they are for, and a comment block covers
# each group — the soft-dependency renderers, for one. Sorting them
# alphabetically tears the gems out from under the comment that explains them.
Bundler/OrderedGems:
  Enabled: false

# `!!x` coerces a truthiness to a boolean, and the cop's alternative does not:
# `if: false` is a supported way to hide a field, and `!false.nil?` is `true`.
# The rewrite would have made hidden fields visible.
Style/DoubleNegation:
  Enabled: false

# A keyword argument is part of a signature: a filter lambda declares `geq:` and
# `leq:` to say it takes a range, whether or not its body reads them. Renaming
# them to `_geq:` would rename the keyword and change what the DSL sees.
Lint/UnusedBlockArgument:
  AllowUnusedKeywordArguments: true

# Shipped by simple_form's generator and kept close to upstream so it can be
# diffed against a newer one.
Layout/LineLength:
  Exclude:
    - 'test/dummy/config/initializers/simple_form.rb'
    - 'test/dummy/config/initializers/simple_form_bootstrap.rb'

# habtm is one of the field types this gem derives a control for, so the
# bookstore has to have one. The cop's advice is right for an application and
# beside the point for the fixture that demonstrates the feature.
Rails/HasAndBelongsToMany:
  Exclude:
    - 'test/dummy/app/models/**/*'

# ── complexity ─────────────────────────────────────────────────────────────
# The tests and the bookstore are out of all of these: a test class is a list
# of tests, and the playground packs every feature into a few files on purpose.
# Neither would ever be refactored to satisfy a count, only silenced.
#
# For the code that ships, the method-level ceilings are set just above what
# the worst method needs today (measured, not guessed). They are there to stop
# growth, not to bless the present: a method that wants more has to earn it in
# review. The one genuine outlier — a 40-line constructor at ABC 39 — is split
# in this same commit rather than configured around.
Metrics/AbcSize:
  Max: 30
  Exclude: &fixtures
    - 'test/**/*'
Metrics/MethodLength:
  Max: 25
  Exclude: *fixtures
Metrics/CyclomaticComplexity:
  Max: 12
  Exclude: *fixtures
Metrics/PerceivedComplexity:
  Max: 13
  Exclude: *fixtures

# Declaration blocks are long because the declaration is long — that is the
# point of a DSL. A gemspec and a routes file are the same shape.
Metrics/BlockLength:
  AllowedMethods:
    - crud_structure
    - draw
  Exclude:
    - '*.gemspec'
    - 'test/**/*'

# Length is not the signal here. A presenter is long because of how many
# surfaces it renders, a field type because of how many facets it answers —
# splitting either to get under a line count scatters code that belongs
# together. The complexity ceilings above are the ones that bite.
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false

# The bookstore's flash messages are written in place, in English, because the
# playground is read as documentation — a locale key would send the reader to
# another file to find out what the screen says. The gem's own strings do go
# through i18n, and there the cop applies.
Rails/I18nLocaleTexts:
  Exclude:
    - 'test/dummy/**/*'
