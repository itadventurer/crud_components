    columns:
      edit: "Columns"
      apply: "Apply"
      reset: "Reset"
      legend: "Show columns"
    attachment:
      keep: "Keep"
      remove: "Remove"
    actions:
      new: "New"
      show: "Show"
      edit: "Edit"
      destroy: "Delete"
    filter:
      any: "–"
      not_set: "Not set"
      present: "Present"
      absent: "Absent"
      "yes": "Yes"
      "no": "No"
      search: "Search"
      apply: "Apply"
      submit: "Filter"
      reset: "Reset"
      sort_by: "Sort by"
      unsorted: "–"
      direction: "Direction"
      asc: "Ascending"
      desc: "Descending"
    pager:
      label: "Pagination"
      summary: "Page %{page} of %{total} · %{count} total"
